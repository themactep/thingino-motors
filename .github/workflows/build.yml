name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build binaries
        run: make -j2

      - name: Upload motors artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motors-binaries
          path: |
            motors
            motors-daemon
